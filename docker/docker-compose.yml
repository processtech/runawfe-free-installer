# Общие настройки для всех сервисов (шаблон)
x-common: &common
  build:
    context: .. # Чтобы видеть install.jar в корне
  stdin_open: true
  tty: true
  volumes:
    - ../install.jar:/installer/install.jar:ro
  command: java -Dfile.encoding=UTF-8 -jar /installer/install.jar  

# Настройки только для GUI сервисов
x-gui: &gui
  <<: *common
  shm_size: '256m'
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /mnt/wslg:/mnt/wslg
    - ../install.jar:/installer/install.jar:ro
  environment:
    - DISPLAY=:0
    - WAYLAND_DISPLAY=wayland-0
    - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
    - QT_X11_NO_MITSHM=1
    - GDK_BACKEND=x11
    - NO_AT_BRIDGE=1

services:
  astra17-gui:
    <<: *gui
    build:
      context: ..
      dockerfile: docker/Dockerfile.astra17-gui
    image: astra17-for-izpack-gui

  astra17-console:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.astra17-console
    image: astra17-for-izpack-console

  astra18-gui:
    <<: *gui
    build:
      context: ..
      dockerfile: docker/Dockerfile.astra18-gui
    image: astra18-for-izpack-gui

  astra18-console:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.astra18-console
    image: astra18-for-izpack-console

  altp10-gui:
    <<: *gui
    build:
      context: ..
      dockerfile: docker/Dockerfile.altp10-gui
    image: altp10-for-izpack-gui

  altp10-console:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.altp10-console
    image: altp10-for-izpack-console

  altp11-gui:
    <<: *gui
    build:
      context: ..
      dockerfile: docker/Dockerfile.altp11-gui
    image: altp11-for-izpack-gui

  altp11-console:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.altp11-console
    image: altp11-for-izpack-console

  redos8-gui:
    <<: *gui
    build:
      context: ..
      dockerfile: docker/Dockerfile.redos8-gui
    image: redos8-for-izpack-gui

  redos8-console:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.redos8-console
    image: redos8-for-izpack-console

  macos-gui:
    image: dockurr/macos
    container_name: macos
    environment:
      VERSION: "14"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      WIDTH: 1280
      HEIGHT: 800
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./macos:/storage
    stop_grace_period: 2m    